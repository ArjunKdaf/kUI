# Device cross-linking against the kUI cross-toolchain
# (aarch64-kui-linux-gnu: gcc 8.5.0 / glibc 2.28, built from crosstool-NG).
# The toolchain/ dir is gitignored; its sysroot carries the
# Hammer's own device libs (SDL2, GLES/EGL, PowerVR) overlaid on glibc 2.28.
[target.aarch64-unknown-linux-gnu]
# path is relative to the workspace root (where cargo runs)
linker = "toolchain/bin/aarch64-kui-linux-gnu-gcc"
