[workspace]
resolver = "3"
members = [
    "crates/hal",
    "crates/gfx",
    "crates/config",
    "crates/db",
    "crates/libretro",
    "crates/ra",
    "crates/store",
    "crates/launcher",
    "crates/frontend",
    "crates/cheatdl",
    "crates/daemon",
    "crates/shim",
    "crates/power",
    "crates/msettings",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "LicenseRef-TBD"
repository = ""

[workspace.dependencies]
kui-hal = { path = "crates/hal" }
kui-gfx = { path = "crates/gfx" }
kui-config = { path = "crates/config" }
kui-db = { path = "crates/db" }
kui-libretro = { path = "crates/libretro" }
kui-ra = { path = "crates/ra" }
kui-store = { path = "crates/store" }
kui-cheatdl = { path = "crates/cheatdl" }
sdl2 = "0.38"
miniz_oxide = "0.8"
glow = "0.16"
png = "0.18"
fontdue = "0.9"
libc = "0.2"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
